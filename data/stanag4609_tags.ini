[tag_081]
id = 81
name = Image Horizon Pixel Pack
type = bytes
length = 0
units =
range =
scale =
; MISB ST 0601.8 Floating Length Pack (see MISB RP 0701). Variable-length
; structured payload: Start x0, Start y0, End x1, End y1 (each Uint8,
; percent 0..100), optionally followed by Start Latitude, Start Longitude,
; End Latitude, End Longitude (each Int32, +/-90 / +/-180 degrees).
; gstklvplugin does not decode the internal Pack structure; the value is
; preserved byte-exact as an opaque payload.

