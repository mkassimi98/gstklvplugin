[tag_093]
id = 93
name = Platform Sideslip Angle (Full)
type = int32
length = 4
units = Degrees
range = +/- 90
scale = ~42 nano degrees.
; Out-of-range indicator: -(2^31) = 0x80000000.
; NOTE: MISB ST 0601.8 (23 Oct 2014), Section 8.93, lists this tag's summary
; "Range" header as "+/- 180", but its own Notes/Conversion Formula for the
; same tag state "Map -(2^31-1)..(2^31-1) to +/-90" (identical wording and
; formula intent to Tags 90-92). This is an internal inconsistency in the
; normative document itself. gstklvplugin follows +/-90 for consistency with
; Tags 90-92 and the tag's own mapping notes; this ambiguity is documented
; rather than silently resolved. See doc/standards.md.

